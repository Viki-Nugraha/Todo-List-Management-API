$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"afdhal@gmail.com\",\r

    \  \"password\": \"Password123\"\r

    }"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      if (response.token) {\r

      \    pm.environment.set(\"token\", response.token);\r

      }"
    language: text/javascript
order: 2000
